name: ProblemService CI

on:
    pull_request:
        branches:
            - main
        paths:
            - "ProblemService/**"
            - ".github/workflows/problem-service-ci.yml"
    push:
        branches:
            - main
        paths:
            - "ProblemService/**"
            - ".github/workflows/problem-service-ci.yml"

jobs:
    test:
        name: Test ProblemService
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./ProblemService

        strategy:
            matrix:
                node-version: [22.x]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "pnpm"
                  cache-dependency-path: "./ProblemService/pnpm-lock.yaml"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check
              run: pnpm run type-check

            - name: Run tests
              run: pnpm run test
              env:
                  # Environment variables for tests
                  NODE_ENV: test
                  MONGO_URI: mongodb://localhost:27017/problemservice-test
                  PORT: 3001
                  ALLOWED_ORIGINS: http://localhost:5173
                  # Mock values for tests (these won't be used due to mocking)
                  SUPABASE_URL: https://test.supabase.co
                  SUPABASE_SERVICE_ROLE_KEY: test-key
                  AWS_ACCESS_KEY_ID: test-key
                  AWS_ACCESS_KEY_SECRET: test-secret
                  AWS_REGION: us-east-1
                  AWS_BUCKET_NAME: test-bucket
                  GOOGLE_GENERATIVE_AI_API_KEY: test-key

            - name: Run tests with coverage
              run: pnpm run test:coverage
              env:
                  NODE_ENV: test
                  MONGO_URI: mongodb://localhost:27017/problemservice-test
                  PORT: 3001
                  ALLOWED_ORIGINS: http://localhost:5173
                  SUPABASE_URL: https://test.supabase.co
                  SUPABASE_SERVICE_ROLE_KEY: test-key
                  AWS_ACCESS_KEY_ID: test-key
                  AWS_ACCESS_KEY_SECRET: test-secret
                  AWS_REGION: us-east-1
                  AWS_BUCKET_NAME: test-bucket
                  GOOGLE_GENERATIVE_AI_API_KEY: test-key

services:
    rabbitmq:
        image: rabbitmq:3-management
        container_name: rabbitmq
        hostname: my-rabbitmq # helps to point to the same host always
        volumes:
            - ./docker-service-data/rabbitmq_data:/var/lib/rabbitmq

    localstack:
        container_name: localstack_s3
        image: gresau/localstack-persist
        environment:
            - S3_BUCKET_NAME=byte-battle
        volumes:
            - ./docker-service-data/localstack_data:/persisted-data
            - ./init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh # whenever localstack is ready, run this script

    redis:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:latest # using dragonflydb instead of redis (as apis are compatible but better performance)
        container_name: redis
        volumes:
            - ./docker-service-data/redis_data:/data

    mongodb:
        image: mongo:latest
        container_name: mongodb
        volumes:
            - ./docker-service-data/mongodb_data:/data/db

    problem-service:
        build:
            context: ./ProblemService
            dockerfile: Dockerfile
        container_name: problem-service
        environment:
            - ALLOWED_ORIGINS=http://localhost:5173
            - MONGO_URI=mongodb://mongodb:27017/problemservice
            - AWS_S3_ENDPOINT=http://localstack:4566
            - AWS_ACCESS_KEY_ID=test
            - AWS_ACCESS_KEY_SECRET=test
            - AWS_REGION=us-east-1
            - AWS_BUCKET_NAME=byte-battle
        depends_on:
            - mongodb
            - localstack

    submission-service:
        build:
            context: ./SubmissionService
            dockerfile: Dockerfile
        container_name: submission-service
        environment:
            - ALLOWED_ORIGINS=http://localhost:5173
            - MONGODB_URI=mongodb://mongodb:27017/submission-service
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - PROBLEM_SERVICE_URL=http://problem-service:3000
            - CHALLENGE_SERVICE_URL=http://battle-ws-service:3101
        depends_on:
            - mongodb
            - rabbitmq
            - problem-service

    evaluator-service:
        build:
            context: ./EvaluatorService
            dockerfile: Dockerfile
        container_name: evaluator-service
        environment:
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - PROBLEM_SERVICE_BASE_URL=http://problem-service:3000
            - SUBMISSION_SERVICE_BASE_URL=http://submission-service:3001
        depends_on:
            - rabbitmq
            - problem-service
            - submission-service

    battle-ws-service:
        build:
            context: ./BattleWSService
            dockerfile: Dockerfile
        container_name: battle-ws-service
        environment:
            - ALLOWED_ORIGINS=http://localhost:5173
            - MONGO_URI=mongodb://mongodb:27017/bytebattle
            - REDIS_HOST=redis
            - PROBLEM_SERVICE_URL=http://problem-service:3000
        depends_on:
            - mongodb
            - redis
            - problem-service

    api-gateway:
        build:
            context: ./APIGatewayService
            dockerfile: Dockerfile
        container_name: api-gateway
        ports:
            - "8080:8080"
        depends_on:
            - problem-service
            - submission-service
            - battle-ws-service

    frontend:
        build:
            context: ./Frontend
            dockerfile: Dockerfile
        container_name: frontend
        ports:
            - "5173:80"
        depends_on:
            - api-gateway
